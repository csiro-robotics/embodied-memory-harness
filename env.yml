name: wiki-pipeline
channels:
  - pytorch
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - pyyaml
  - tqdm
  - pytorch
  - scikit-learn        # MACLA.py (macla arm) imports sklearn.metrics at module level
  - pytest
  - pip:
      - alfworld==0.4.2   # pinned: game-file ids are release-sensitive (SDD §4.4)
      - openai
      - sentence-transformers   # MACLA.py semantic similarity (all-MiniLM-L6-v2)
      - ollama                  # imported by MACLA.py; its calls now use the shared client (H11)
      - tokenizers==0.22.2      # real Qwen3 token counts for the memory budget (H6, src/tokens.py)
